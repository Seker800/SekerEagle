name: Desktop Package

on:
  workflow_dispatch:
    inputs:
      target:
        description: Native package target
        required: true
        default: macos
        type: choice
        options:
          - macos
          - windows
          - both

permissions:
  contents: read

concurrency:
  group: desktop-package-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  macos:
    if: inputs.target == 'macos' || inputs.target == 'both'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace @sekereagle/desktop
      - run: npm run test:coverage --workspace @sekereagle/desktop
      - run: npm run package:mac --workspace @sekereagle/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sekereagle-macos-internal-unsigned
          path: apps/desktop/release/*
          if-no-files-found: error

  windows:
    if: inputs.target == 'windows' || inputs.target == 'both'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace @sekereagle/desktop
      - run: npm run test:coverage --workspace @sekereagle/desktop
      - run: npm run package:win --workspace @sekereagle/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sekereagle-windows-x64-internal-unsigned
          path: apps/desktop/release/*
          if-no-files-found: error
