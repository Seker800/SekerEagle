name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run ci:check
      - run: docker compose --env-file .env.example -f deploy/mac/docker-compose.yml config --quiet
      - run: docker build -f apps/api/Dockerfile .
      - run: docker build -f apps/worker/Dockerfile .
      - run: docker build -f apps/web/Dockerfile .
