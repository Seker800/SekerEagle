name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  SCARF_ANALYTICS: 'false'

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run security:audit
      - run: npm run security:audit:all
      - run: npm run db:generate
      - run: npm run ci:check
      - run: npm run test:worker-leases
      - run: npm run contracts:check
      - name: Verify restricted storage credentials and private bucket
        run: SEKEREAGLE_TEST_STORAGE_POLICY=1 node --test scripts/testing/storage-policy.test.mjs
      - name: Verify real database isolation, migrations and full restore
        run: npm run test:library-integration
      - name: Install camera media test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg python3-venv
          python3 -m venv .omx/camera-media/venv
          .omx/camera-media/venv/bin/pip install -r scripts/testing/camera-requirements.txt
      - name: Verify RAW decoding and camera video playback
        run: CAMERA_RAW_PYTHON="$PWD/.omx/camera-media/venv/bin/python" npm run smoke:camera-media
      - name: Verify extended HTTP uploads, edited copies, camera formats, live photos and sends
        run: PHOTO_WORKBENCH_BASIC=1 PHOTO_WORKBENCH_EDITED_COPY=1 PHOTO_WORKBENCH_CAMERA=1 PHOTO_WORKBENCH_LIVE=1 PHOTO_WORKBENCH_SEND=1 CAMERA_RAW_PYTHON="$PWD/.omx/camera-media/venv/bin/python" npm run test:photo-smoke
      - run: docker compose --env-file .env.example -f deploy/mac/docker-compose.yml config --quiet
      - name: Verify private backup files never enter Docker context
        run: SEKEREAGLE_TEST_DOCKER_CONTEXT=1 node --test scripts/backup-build-context.test.mjs
      - run: docker build -f apps/api/Dockerfile .
      - run: docker build -f apps/worker/Dockerfile .
      - run: docker build -f apps/web/Dockerfile .
