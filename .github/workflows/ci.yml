name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run ci:check
      - run: docker compose --env-file .env.example -f deploy/mac/docker-compose.yml config --quiet
      - run: docker build -f apps/api/Dockerfile .
      - run: docker build -f apps/worker/Dockerfile .
      - run: docker build -f apps/web/Dockerfile .
