<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SekerEagle 图片采集设置</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="options-page">
    <main>
      <p class="eyebrow">SekerEagle</p>
      <h1>图片采集设置</h1>
      <p>在网页图片上按住 Alt 并点击右键，即可加入可靠上传队列。</p>
      <form>
        <label for="serverUrl">服务器地址</label>
        <input id="serverUrl" type="url" required autocomplete="url" />
        <label for="pat">浏览器采集 PAT</label>
        <input id="pat" type="password" autocomplete="off" placeholder="seg_pat_…" />
        <small>请只授予 <code>capture:write</code> 权限；令牌只保存在本机扩展存储中。</small>
        <label for="concurrency">并发上传数</label>
        <input id="concurrency" type="number" min="1" max="6" required />
        <button type="submit">保存配置</button>
        <p id="status" role="status"></p>
      </form>
    </main>
    <script type="module" src="src/options.js"></script>
  </body>
</html>
