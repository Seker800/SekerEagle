<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SekerEagle 图片采集设置</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="options-page">
    <main>
      <p class="eyebrow">SekerEagle</p>
      <h1>图片采集设置</h1>
      <p>在网页图片上按住 Alt 并点击右键，即可加入可靠上传队列。</p>
      <form>
        <label for="connectionMode">连接模式</label>
        <select id="connectionMode">
          <option value="auto">自动：内网优先，失败后尝试公网</option>
          <option value="local">仅使用内网</option>
          <option value="public">仅使用公网</option>
        </select>
        <label for="localServerUrl">内网服务器地址</label>
        <input id="localServerUrl" type="url" autocomplete="url" />
        <small>本机默认使用 <code>http://localhost:8180</code>。</small>
        <label for="publicServerUrl">公网服务器地址（可选）</label>
        <input id="publicServerUrl" type="url" inputmode="url" placeholder="http://公网IP:端口" />
        <small>可以是固定域名或公网 IP 与端口；映射未开启时可以留空。</small>
        <label class="checkbox-row" for="allowInsecurePublicHttp">
          <input id="allowInsecurePublicHttp" type="checkbox" />
          <span>允许公网 HTTP（PAT 和图片将以明文传输）</span>
        </label>
        <label for="pat">浏览器采集 PAT</label>
        <input id="pat" type="password" autocomplete="off" placeholder="seg_pat_…" />
        <small>请只授予 <code>capture:write</code> 权限；令牌只保存在本机扩展存储中。</small>
        <label for="concurrency">并发上传数</label>
        <input id="concurrency" type="number" min="1" max="6" required />
        <button type="submit">保存配置</button>
        <p id="status" role="status"></p>
      </form>
    </main>
    <script type="module" src="src/options.js"></script>
  </body>
</html>
