[project]
name = "sekereagle-mlx-embedding"
version = "0.1.0"
license = "GPL-3.0-only"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.162.0",
  "huggingface-hub==2.2.0",
  "mlx-embeddings==0.1.0",
  "pillow==13.0.0",
  "torch==2.14.1",
  "torchvision==0.29.1",
  "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = ["httpx2==2.13.1", "pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
