[project]
name = "sekereagle-mlx-embedding"
version = "0.1.0"
license = "GPL-3.0-only"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.116.1",
  "huggingface-hub==1.28.0",
  "mlx-embeddings==0.1.0",
  "pillow==11.3.0",
  "torch==2.13.0",
  "torchvision==0.28.0",
  "uvicorn[standard]==0.52.3",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==8.4.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
