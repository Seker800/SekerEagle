plugins { id 'com.android.application'; id 'jacoco' }
android {
    namespace 'com.sekereagle.android'
    compileSdk 36
    defaultConfig {
        applicationId 'com.sekereagle.android'
        minSdk 30
        targetSdk 36
        versionCode 4
        versionName '0.1.3'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { applicationIdSuffix '.debug'; enableUnitTestCoverage true }
        release { minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main.assets.srcDirs += layout.buildDirectory.dir('generated/media-assets'); androidTest.assets.srcDirs += layout.buildDirectory.dir('generated/device-fixtures') }
    lint { abortOnError true; disable 'OldTargetApi', 'GradleDependency', 'NewerVersionAvailable' }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies { implementation 'com.google.android.material:material:1.13.0'; testImplementation 'junit:junit:4.13.2'; androidTestImplementation 'androidx.test:runner:1.7.0'; androidTestImplementation 'junit:junit:4.13.2' }
tasks.register('generateMediaPolicy', Exec) { workingDir rootProject.projectDir; commandLine 'node', 'scripts/generate-media-policy.mjs' }
tasks.named('preBuild') { dependsOn 'generateMediaPolicy' }

jacoco { toolVersion = '0.8.14' }
def coreClasses = fileTree(layout.buildDirectory.dir('intermediates/javac/debug/compileDebugJavaWithJavac/classes')) { include 'com/sekereagle/android/core/**' }
def unitCoverage = layout.buildDirectory.file('outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec')
tasks.register('coreCoverage', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    executionData unitCoverage
    classDirectories.from coreClasses
    sourceDirectories.from files('src/main/java')
    reports { xml.required = true; html.required = true }
}
tasks.register('verifyCoreCoverage', JacocoCoverageVerification) {
    dependsOn 'coreCoverage'
    executionData unitCoverage
    classDirectories.from coreClasses
    violationRules { rule { limit { counter = 'LINE'; minimum = 0.80 }; limit { counter = 'BRANCH'; minimum = 0.80 } } }
}

tasks.register('generateDeviceFixtures', Exec) { workingDir rootProject.projectDir; commandLine 'node', 'scripts/generate-test-fixtures.mjs' }
tasks.matching { it.name == 'mergeDebugAndroidTestAssets' }.configureEach { dependsOn 'generateDeviceFixtures' }
