plugins { id 'com.android.application'; id 'jacoco'; id 'org.jetbrains.kotlin.plugin.compose' }
android {
    namespace 'com.sekereagle.android'
    compileSdk 36
    defaultConfig {
        applicationId 'com.sekereagle.android'
        minSdk 30
        targetSdk 36
        versionCode 22
        versionName '0.9.5'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true; compose true }
    buildTypes {
        debug { applicationIdSuffix '.debug'; enableUnitTestCoverage true }
        release { minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main.assets.srcDirs += [layout.buildDirectory.dir('generated/media-assets'), layout.buildDirectory.dir('generated/editor-assets')] }
    lint { abortOnError true; disable 'OldTargetApi', 'GradleDependency', 'NewerVersionAvailable' }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies { implementation 'com.google.android.material:material:1.13.0'; testImplementation 'junit:junit:4.13.2'; androidTestImplementation 'androidx.test:runner:1.7.0'; androidTestImplementation 'junit:junit:4.13.2' }
tasks.register('generateMediaPolicy', Exec) { workingDir rootProject.projectDir; commandLine 'node', 'scripts/generate-media-policy.mjs' }
tasks.named('preBuild') { dependsOn 'generateMediaPolicy' }

jacoco { toolVersion = '0.8.14' }
def coreClasses = fileTree(layout.buildDirectory.dir('intermediates/javac/debug/compileDebugJavaWithJavac/classes')) { include 'com/sekereagle/android/core/**' }
def unitCoverage = layout.buildDirectory.file('outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec')
tasks.register('coreCoverage', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    executionData unitCoverage
    classDirectories.from coreClasses
    sourceDirectories.from files('src/main/java')
    reports { xml.required = true; html.required = true }
}
tasks.register('verifyCoreCoverage', JacocoCoverageVerification) {
    dependsOn 'coreCoverage'
    executionData unitCoverage
    classDirectories.from coreClasses
    violationRules { rule { limit { counter = 'LINE'; minimum = 0.80 }; limit { counter = 'BRANCH'; minimum = 0.80 } } }
}

abstract class GenerateDeviceFixtures extends Exec {
    @org.gradle.api.tasks.OutputDirectory
    abstract org.gradle.api.file.DirectoryProperty getOutputDirectory()
}
def deviceFixtures = tasks.register('generateDeviceFixtures', GenerateDeviceFixtures) {
    workingDir rootProject.projectDir
    commandLine 'node', 'scripts/generate-test-fixtures.mjs'
    inputs.files(rootProject.file('scripts/generate-test-fixtures.mjs'), rootProject.file('../../scripts/testing/create-camera-fixtures.py'))
    inputs.files(rootProject.file('../../.omx/artifacts/native-test-credentials.json'), rootProject.file('../../.omx/artifacts/photo-workbench.json')).optional()
    outputDirectory.set(layout.buildDirectory.dir('generated/device-fixtures'))
}
// Attach the producer, so AGP snapshots assets after refreshed test credentials are generated.
androidComponents.onVariants(androidComponents.selector().withBuildType('debug')) { variant ->
    variant.deviceTests.values().each { deviceTest ->
        deviceTest.sources.assets.addGeneratedSourceDirectory(deviceFixtures, { task -> task.outputDirectory })
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.03.00')
    implementation 'androidx.activity:activity-compose:1.12.3'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.03.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

tasks.register('generateEditor', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', 'scripts/build-editor.mjs'
    inputs.dir rootProject.file('../web/src')
    inputs.file rootProject.file('../web/native-editor.html')
    inputs.file rootProject.file('../web/vite.config.ts')
    inputs.file rootProject.file('../../package-lock.json')
    inputs.dir rootProject.file('../../packages/library-core/src')
    inputs.dir rootProject.file('../../packages/eagle-filter-core/src')
    inputs.file rootProject.file('scripts/build-editor.mjs')
    outputs.dir layout.buildDirectory.dir('generated/editor-assets')
}
tasks.named('preBuild') { dependsOn 'generateEditor' }
