plugins { id 'com.android.application' }
android {
    namespace 'com.sekereagle.android'
    compileSdk 36
    defaultConfig {
        applicationId 'com.sekereagle.android'
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { applicationIdSuffix '.debug'; enableUnitTestCoverage true }
        release { minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main.assets.srcDirs += layout.buildDirectory.dir('generated/media-assets') }
    lint { abortOnError true; disable 'OldTargetApi', 'GradleDependency', 'NewerVersionAvailable' }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
tasks.register('generateMediaPolicy', Exec) { workingDir rootProject.projectDir; commandLine 'node', 'scripts/generate-media-policy.mjs' }
tasks.named('preBuild') { dependsOn 'generateMediaPolicy' }
