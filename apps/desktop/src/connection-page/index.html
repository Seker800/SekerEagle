<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="pageTitle">SekerEagle 桌面设置</title>
    <link rel="stylesheet" href="/connection.css" />
  </head>
  <body>
    <div class="shell">
      <header class="toolbar">
        <div class="brand"><img src="/seker-eagle-logo.svg" alt="" /><span>SekerEagle</span></div>
        <button id="cancel" class="quiet-button" type="button" data-i18n="backToLibrary" hidden>
          返回图库
        </button>
      </header>
      <main class="content">
        <section id="offline-view" class="status-panel">
          <span class="status-icon" aria-hidden="true">!</span>
          <h1 data-i18n="cannotConnect">无法连接素材库</h1>
          <p data-i18n="autoRetryDescription">正在自动重试。连接恢复后会自动打开图库。</p>
          <div class="status-actions">
            <button id="retry" class="primary" type="button" data-i18n="retryNow">立即重试</button>
            <button id="show-connection-settings" type="button" data-i18n="checkConnectionSettings">
              检查连接设置
            </button>
          </div>
        </section>
        <section id="online-view" class="status-panel" hidden>
          <span class="connected-dot" aria-hidden="true"></span>
          <h1 data-i18n="connected">已连接素材库</h1>
          <p id="active-connection">—</p>
          <button id="online-return" class="primary" type="button" data-i18n="backToLibrary">
            返回图库
          </button>
        </section>
        <p id="message" class="message" role="status"></p>
        <details id="connection-details" class="settings-group">
          <summary>
            <span data-i18n="connectionSettings">连接设置</span
            ><small data-i18n="connectionSettingsHint">更改地址或查看连接问题</small>
          </summary>
          <form id="connection-form">
            <label class="field"
              ><span data-i18n="connectionMode">连接方式</span>
              <select name="mode">
                <option value="AUTO" data-i18n="automatic">自动选择</option>
                <option value="LOCAL" data-i18n="fixedLocal">固定本地</option>
                <option value="LAN" data-i18n="fixedLan">固定局域网</option>
                <option value="PUBLIC" data-i18n="fixedPublic">固定外网</option>
              </select>
            </label>
            <p class="help" data-i18n="automaticModeDescription">
              自动选择会优先使用当前可用连接，断开后再尝试其他地址。
            </p>
            <div class="profile">
              <label for="local-url" data-i18n="local">本地</label
              ><span data-status="LOCAL" data-i18n="notTested">未检测</span
              ><input
                id="local-url"
                name="localUrl"
                type="url"
                placeholder="http://localhost:8180"
              />
            </div>
            <div class="profile">
              <label for="lan-url" data-i18n="lan">局域网</label
              ><span data-status="LAN" data-i18n="notConfigured">未配置</span
              ><input
                id="lan-url"
                name="lanUrl"
                type="url"
                placeholder="https://eagle.lan.example"
              /><label class="checkbox"
                ><input name="allowInsecureLan" type="checkbox" /><span data-i18n="allowPrivateHttp"
                  >允许可信局域网的私有 IP 使用 HTTP</span
                ></label
              >
            </div>
            <div class="profile">
              <label for="public-url" data-i18n="publicNetwork">外网</label
              ><span data-status="PUBLIC" data-i18n="notConfigured">未配置</span
              ><input
                id="public-url"
                name="publicUrl"
                type="url"
                placeholder="https://eagle.example.com"
              /><label class="checkbox"
                ><input name="allowInsecurePublicHttp" type="checkbox" /><span
                  data-i18n="allowPublicHttp"
                  >允许外网使用 HTTP（登录信息将明文传输）</span
                ></label
              >
            </div>
            <div class="form-actions">
              <button id="test" type="button" data-i18n="testAllConnections">检测连接</button
              ><button class="primary" type="submit" data-i18n="saveAndConnect">保存并连接</button>
            </div>
            <button id="reset" class="danger-link" type="button" data-i18n="changeLibrary" hidden>
              更换为另一套图库…
            </button>
          </form>
        </details>
        <section id="cache-settings" class="cache-section" hidden>
          <div class="cache-summary">
            <div>
              <h2 data-i18n="localMediaCache">本地媒体缓存</h2>
              <p data-i18n="cacheSimpleDescription">
                常用图片保存在这台电脑上，空间不足时会自动清理。
              </p>
            </div>
            <strong id="cache-global-usage">—</strong>
          </div>
          <details class="settings-group compact-group">
            <summary data-i18n="cacheManagement">管理缓存</summary>
            <div class="cache-body">
              <p>
                <span data-i18n="currentAccountUsage">当前账号占用</span
                ><strong id="cache-account-usage">—</strong>
              </p>
              <div class="technical-stats">
                <p>
                  <span data-i18n="cacheFiles">缓存文件</span
                  ><strong id="cache-entry-count">—</strong>
                </p>
                <p><span data-i18n="hitRate">命中率</span><strong id="cache-hit-rate">—</strong></p>
                <p>
                  <span data-i18n="trafficSaved">已节省流量</span
                  ><strong id="cache-saved-bytes">—</strong>
                </p>
                <p>
                  <span data-i18n="diskAvailable">磁盘剩余</span
                  ><strong id="cache-free-space">—</strong>
                </p>
              </div>
              <form id="cache-form">
                <label class="field"
                  ><span data-i18n="cacheLimit">缓存容量上限</span
                  ><span class="input-with-unit"
                    ><input
                      name="cacheLimitGiB"
                      type="number"
                      min="1"
                      max="100"
                      step="1"
                      required
                    /><span>GiB</span></span
                  ></label
                ><button id="save-cache" type="submit" data-i18n="saveCacheSettings">
                  保存容量
                </button>
              </form>
              <div class="cache-actions">
                <button id="clear-cache" type="button" data-i18n="clearCurrentAccountCache">
                  清空当前账号缓存</button
                ><button id="open-cache-folder" type="button" data-i18n="openInFileManager">
                  打开缓存文件夹
                </button>
              </div>
              <code id="cache-path">—</code>
              <p id="cache-message" role="status"></p>
            </div>
          </details>
        </section>
      </main>
    </div>
    <script src="/connection.js"></script>
  </body>
</html>
