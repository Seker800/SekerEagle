name: sekereagle

x-api-environment: &api-environment
  NODE_ENV: production
  PORT: 3000
  CANONICAL_ORIGIN: http://localhost:8180
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/sekereagle?schema=public
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  ACCESS_TOKEN_TTL_SECONDS: 900
  REFRESH_TOKEN_TTL_SECONDS: 2592000
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: http://localhost:8180
  S3_REGION: us-east-1
  S3_BUCKET: sekereagle-assets
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  S3_CONNECTION_TIMEOUT_MS: ${S3_CONNECTION_TIMEOUT_MS:-3000}
  S3_REQUEST_TIMEOUT_MS: ${S3_REQUEST_TIMEOUT_MS:-12000}
  S3_SOCKET_TIMEOUT_MS: ${S3_SOCKET_TIMEOUT_MS:-10000}
  S3_MAX_SOCKETS: ${S3_MAX_SOCKETS:-64}
  MLX_EMBEDDING_URL: http://host.docker.internal:11435
  MLX_EMBEDDING_TOKEN: ${MLX_EMBEDDING_TOKEN}
  MLX_EMBEDDING_MODEL: Qwen/Qwen3-VL-Embedding-2B
  MLX_EMBEDDING_REVISION: ${MLX_EMBEDDING_REVISION:-9f2f7e710d6d81056aa5c0a4f04764fec6bb7bda}
  MLX_EMBEDDING_SPACE_ID: qwen3-vl-embedding-2b-1024-v1
  MLX_EMBEDDING_TIMEOUT_MS: 120000
  MLX_EMBEDDING_MAX_PAYLOAD_BYTES: 20971520
  EAGLE_VECTOR_MINIMUM_SCORE: 0.3
  OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
  OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen3-vl:8b-instruct}
  OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-120000}
  EAGLE_AI_TAG_SEARCH_MINIMUM_SIMILARITY: ${EAGLE_AI_TAG_SEARCH_MINIMUM_SIMILARITY:-0.78}
  EAGLE_MEDIA_THROTTLE_V2_ENABLED: ${EAGLE_MEDIA_THROTTLE_V2_ENABLED:-true}
  EAGLE_MEDIA_OWNER_RATE_LIMIT_PER_SECOND: ${EAGLE_MEDIA_OWNER_RATE_LIMIT_PER_SECOND:-256}
  EAGLE_MEDIA_OWNER_RATE_LIMIT_PER_MINUTE: ${EAGLE_MEDIA_OWNER_RATE_LIMIT_PER_MINUTE:-6000}
  EAGLE_MEDIA_IP_RATE_LIMIT_PER_SECOND: ${EAGLE_MEDIA_IP_RATE_LIMIT_PER_SECOND:-1024}
  EAGLE_MEDIA_IP_RATE_LIMIT_PER_MINUTE: ${EAGLE_MEDIA_IP_RATE_LIMIT_PER_MINUTE:-24000}

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    platform: linux/arm64
    restart: unless-stopped
    shm_size: 512m
    environment:
      POSTGRES_DB: sekereagle
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - sekereagle_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d sekereagle']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 2g

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    platform: linux/arm64
    command: server /data --console-address :9001
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - sekereagle_minio:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 2g

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    platform: linux/arm64
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/sekereagle-assets
    restart: 'no'

  migrate:
    platform: linux/arm64
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    command: ['npm', 'run', 'db:migrate:deploy']
    restart: 'no'

  api:
    platform: linux/arm64
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 2g

  worker:
    platform: linux/arm64
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    stop_grace_period: 30s
    mem_limit: 6g

  web:
    platform: linux/arm64
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    mem_limit: 256m

  gateway:
    image: nginx:1.31-alpine
    platform: linux/arm64
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - '127.0.0.1:8180:8080'
    volumes:
      - ../gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 256m

volumes:
  sekereagle_postgres:
    name: sekereagle_postgres
  sekereagle_minio:
    name: sekereagle_minio
