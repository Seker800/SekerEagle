server_tokens off;
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types text/css application/javascript application/json application/geo+json application/wasm image/svg+xml;
proxy_hide_header X-Powered-By;

resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

# Compose replaces containers during deploys. Keep upstream discovery dynamic so
# a long-lived gateway never pins a retired container IP and starts returning 502.
upstream api_backend {
  keepalive 16;
  zone api_backend 64k;
  server api:3000 resolve;
}

upstream minio_backend {
  keepalive 16;
  zone minio_backend 64k;
  server minio:9000 resolve;
}

upstream web_backend {
  keepalive 16;
  zone web_backend 64k;
  server web:8080 resolve;
}

server {
  listen 8080;
  server_name localhost;
  client_max_body_size 32m;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: sekereagle-media:; media-src 'self' blob:; connect-src 'self'; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;


  # Full-library admission and original-file verification can exceed the short API deadline.
  # Other API requests keep their existing short deadline.
  location ~ ^/api/photos/(tasks/start|photography/people/scan)$ {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 660s;
    proxy_send_timeout 15s;
    proxy_buffering off;
  }

  # Full original-file hashing and camera inspection keep their own bounded deadline.
  location ~ "^/api/(eagle|photos)/uploads/[a-fA-F0-9-]{36}/complete$" {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 660s;
    proxy_send_timeout 15s;
    proxy_buffering off;
  }

  # Persisting a large selection may use the API's 120-second admission transaction.
  location ~ "^/api/(eagle|photos)/(operations|operations/[a-fA-F0-9-]{36}/retry|assets/batch/send|duplicates/cleanup|duplicates/scan)$" {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 150s;
    proxy_send_timeout 15s;
    proxy_buffering off;
  }

  location /api/ {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_buffering off;
  }

  location ^~ /sekereagle-assets/ {
    proxy_pass http://minio_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # MinIO verifies this host against the loopback identity used to sign upload URLs.
    # The browser extension may reach the same gateway through a public HTTPS alias.
    proxy_set_header Host localhost:8180;
    proxy_request_buffering off;
    proxy_buffering off;
  }

  location /media/ {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_buffering off;
  }

  location / {
    proxy_pass http://web_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
  }
}
