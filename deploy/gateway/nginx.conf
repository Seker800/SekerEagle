server {
  listen 8080;
  server_name localhost;
  client_max_body_size 32m;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_buffering off;
  }

  location ^~ /sekereagle-assets/ {
    proxy_pass http://minio:9000;
    proxy_http_version 1.1;
    # MinIO verifies this host against the loopback identity used to sign upload URLs.
    # The browser extension may reach the same gateway through a public HTTPS alias.
    proxy_set_header Host localhost:8180;
  }

  location /media/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_buffering off;
  }

  location / {
    proxy_pass http://web:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
}
